name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      # 覆盖率门禁（Lab 7）：整体 ≥70%
      - name: Test
        run: pytest -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=70

      # 覆盖率门禁（Lab 7）：核心聚合（domain 层）≥90%；复用上一步的 .coverage，不重跑测试
      - name: Coverage gate (core aggregates >= 90%)
        run: python -m coverage report --include="*/domain/*" --fail-under=90

      # 契约防漂移：API 变更后必须重跑 scripts/export_openapi.py 同步 openapi.json
      - name: OpenAPI contract drift check
        run: python scripts/export_openapi.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        run: pnpm run typecheck

      - name: Frontend tests
        run: pnpm run test:coverage

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Frontend browser E2E
        run: pnpm run test:e2e

      - name: Frontend build
        run: pnpm run build

      - name: Frontend lint
        run: pnpm run lint

  frontend-container:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t campusoverflow-frontend:ci .

      - name: Check frontend container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name campusoverflow-frontend-ci -p 8080:80 campusoverflow-frontend:ci
          trap 'docker stop campusoverflow-frontend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz | grep -q '^ok$'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/questions | grep -q '<div id="root"></div>'
