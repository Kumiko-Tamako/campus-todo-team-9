name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest -m "not integration"

      # 契约防漂移：API 变更后必须重跑 scripts/export_openapi.py 同步 openapi.json
      - name: OpenAPI contract drift check
        run: python scripts/export_openapi.py --check
